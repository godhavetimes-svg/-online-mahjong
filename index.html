<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ONLINE SANMA</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:#111;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
button,input,select{font:inherit}
button{border:0;cursor:pointer}
.hidden{display:none!important}

.app{max-width:900px;margin:auto;padding:18px;min-height:100vh}
.logo{text-align:center;font-size:28px;font-weight:900;margin:10px 0}
.sub{text-align:center;color:#aaa;margin-bottom:20px;font-size:13px}
.card{
  background:#1b1b1b;border:1px solid #333;border-radius:16px;
  padding:16px;margin-bottom:14px
}
label{display:block;color:#aaa;font-size:13px;margin:10px 0 6px}
input,select{
  width:100%;padding:13px;background:#292929;color:#fff;
  border:1px solid #444;border-radius:10px
}
button{
  padding:12px 16px;border-radius:10px;color:#fff;
  background:#333;font-weight:800
}
.main-btn{width:100%;margin-top:12px;background:#e91e63}
.dark-btn{width:100%;margin-top:10px}
.error{
  background:#411818;color:#ffabab;padding:12px;
  border-radius:10px;margin-bottom:12px
}

.room-id{
  text-align:center;font-size:34px;letter-spacing:7px;
  color:#ff4081;font-weight:900
}
.status{text-align:center;color:#bbb;margin:10px 0}
.player{
  display:flex;justify-content:space-between;align-items:center;
  background:#272727;border-radius:10px;padding:12px;margin:7px 0
}
.ready{color:#6dff9d}
.waiting{color:#999}

.table{
  position:relative;width:100%;aspect-ratio:1/1;
  max-height:800px;background:#087244;
  border:10px solid #55351f;border-radius:24px;
  overflow:hidden;box-shadow:0 8px 30px #000
}
.center{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:#075a37;border:2px solid #43a77a;border-radius:15px;
  width:170px;padding:12px;text-align:center
}
.turn{font-size:17px;font-weight:900;color:#ffe066}
.remaining{color:#b8e6d1;font-size:12px;margin-top:7px}

.seat{
  position:absolute;text-align:center;
  background:rgba(0,0,0,.45);padding:6px 9px;border-radius:9px;
  min-width:90px
}
.top{top:12px;left:50%;transform:translateX(-50%)}
.right{right:8px;top:50%;transform:translateY(-50%)}
.bottom{bottom:8px;left:50%;transform:translateX(-50%)}
.seatName{font-weight:900;font-size:13px}
.points{font-size:12px;color:#ddd;margin-top:3px}

.discards{
  position:absolute;left:17%;right:17%;top:31%;bottom:27%;
  display:flex;flex-wrap:wrap;align-content:flex-start;
  gap:4px;overflow:hidden
}
.discard{
  width:28px;height:38px;background:#f7f7f7;color:#111;
  border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:22px
}

.hand{
  position:absolute;bottom:58px;left:5px;right:5px;
  display:flex;justify-content:center;gap:2px;align-items:flex-end
}
.tile{
  width:34px;height:50px;background:#f5f5f5;color:#111;
  border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-size:25px;box-shadow:0 2px 3px #0006;
  user-select:none
}
.tile.playable{cursor:pointer}
.tile.playable:active{
  transform:translateY(-12px);
  box-shadow:0 0 10px #ffeb3b
}

.actions{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  display:flex;gap:5px
}
.actions button{font-size:11px;padding:8px 9px}
.actions button.active{background:#e91e63}
.result{
  text-align:center;padding:25px;background:#1d1d1d;
  border-radius:16px;margin-top:15px
}
.result h2{margin-top:0;color:#ff4081}
.rank{padding:11px;background:#292929;border-radius:9px;margin:7px 0}
.positive{color:#6dff9d}.negative{color:#ff7070}

@media(max-width:600px){
  .app{padding:8px}
  .table{border-width:7px}
  .tile{width:25px;height:40px;font-size:20px}
  .discard{width:23px;height:32px;font-size:18px}
  .center{width:135px}
  .actions button{padding:6px;font-size:9px}
}
</style>
</head>

<body>

<!-- ロビー -->
<div id="lobby" class="app">
  <div class="logo">🀄 ONLINE SANMA</div>
  <div class="sub">3 PLAYER ONLINE MAHJONG</div>

  <div id="message"></div>

  <div class="card">
    <label>プレイヤー名</label>
    <input id="playerName" maxlength="12" placeholder="名前">

    <label>BET額</label>
    <select id="betAmount">
      <option value="100">100 pt</option>
      <option value="500">500 pt</option>
      <option value="1000" selected>1,000 pt</option>
      <option value="5000">5,000 pt</option>
    </select>

    <button class="main-btn" onclick="createRoom()">ルームを作成</button>
  </div>

  <div class="card">
    <label>ルームID</label>
    <input id="joinRoomId" inputmode="numeric" maxlength="6"
           placeholder="6桁のルームID">
    <button class="dark-btn" onclick="joinRoom()">ルームに参加</button>
  </div>
</div>

<!-- 待機室 -->
<div id="room" class="app hidden">
  <div class="logo">🀄 WAITING ROOM</div>

  <div class="card">
    <div class="status">ROOM ID</div>
    <div id="roomId" class="room-id">------</div>
    <button class="dark-btn" onclick="copyRoomId()">ルームIDをコピー</button>
  </div>

  <div class="card">
    <div class="status">BET：<span id="betDisplay">0</span> pt</div>
    <div id="players"></div>
    <button id="readyBtn" class="main-btn" onclick="toggleReady()">準備OK</button>
    <div id="roomStatus" class="status">0/3人参加</div>
  </div>

  <button class="dark-btn" onclick="leaveRoom()">退出</button>
</div>

<!-- ゲーム -->
<div id="game" class="app hidden">
  <div class="logo">🀄 SANMA</div>

  <div class="table">

    <div class="seat top">
      <div id="topName" class="seatName">対面</div>
      <div id="topPoints" class="points">10000 pt</div>
    </div>

    <div class="seat right">
      <div id="rightName" class="seatName">上家</div>
      <div id="rightPoints" class="points">10000 pt</div>
    </div>

    <div class="seat bottom">
      <div id="myName" class="seatName">あなた</div>
      <div id="myPoints" class="points">10000 pt</div>
    </div>

    <div class="center">
      <div id="round">東1局</div>
      <div id="turnDisplay" class="turn">開始待機中</div>
      <div id="remaining" class="remaining">山：0枚</div>
    </div>

    <div id="discards" class="discards"></div>
    <div id="myHand" class="hand"></div>

    <div class="actions">
      <button id="drawBtn" class="active" onclick="drawTile()">ツモる</button>
      <button onclick="finishGame()">終了</button>
    </div>

  </div>

  <div id="resultBox"></div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getDatabase, ref, set, get, update, remove, onValue
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig = {
  apiKey:"AIzaSyAwCitt9BKUnsDP57iNqX7BGlfJo_i2_kI",
  authDomain:"online--merger.firebaseapp.com",
  databaseURL:"https://online--merger-default-rtdb.firebaseio.com/",
  projectId:"online--merger",
  storageBucket:"online--merger.firebasestorage.app",
  messagingSenderId:"898248807664",
  appId:"1:898248807664:web:f4f0b6c928e889f9ad1e35"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

let myId="";
let myRoom="";
let roomUnsubscribe=null;
let starting=false;

const TILES=[
  "🀇","🀇","🀇","🀇",
  "🀏","🀏","🀏","🀏",
  "🀐","🀐","🀐","🀐",
  "🀙","🀙","🀙","🀙",
  "🀚","🀚","🀚","🀚",
  "🀛","🀛","🀛","🀛",
  "🀜","🀜","🀜","🀜",
  "🀝","🀝","🀝","🀝",
  "🀞","🀞","🀞","🀞",
  "🀀","🀀","🀀","🀀",
  "🀁","🀁","🀁","🀁",
  "🀂","🀂","🀂","🀂",
  "🀃","🀃","🀃","🀃",
  "🀆","🀆","🀆","🀆",
  "🀅","🀅","🀅","🀅",
  "🀄","🀄","🀄","🀄",
  "🀫","🀫","🀫","🀫",
  "🀢","🀢","🀢","🀢"
];

function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [b[i],b[j]]=[b[j],b[i]];
  }
  return b;
}

function playerId(){
  return "p_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
}

function roomId(){
  return String(Math.floor(100000+Math.random()*900000));
}

function showMessage(text){
  document.getElementById("message").innerHTML=
    `<div class="error">${text}</div>`;
}

window.createRoom=async()=>{
  const name=document.getElementById("playerName").value.trim();
  const bet=Number(document.getElementById("betAmount").value);

  if(!name)return showMessage("名前を入力してください");

  myId=playerId();
  myRoom=roomId();

  await set(ref(db,"rooms/"+myRoom),{
    status:"waiting",
    host:myId,
    bet,
    players:{
      [myId]:{
        name,
        points:10000,
        ready:false,
        host:true
      }
    }
  });

  enterRoom();
};

window.joinRoom=async()=>{
  const name=document.getElementById("playerName").value.trim();
  const id=document.getElementById("joinRoomId").value.trim();

  if(!name)return showMessage("名前を入力してください");
  if(!/^\d{6}$/.test(id))return showMessage("6桁のIDを入力してください");

  const snap=await get(ref(db,"rooms/"+id));
  if(!snap.exists())return showMessage("ルームがありません");

  const room=snap.val();
  const players=room.players||{};

  if(room.status!=="waiting")
    return showMessage("対局はすでに始まっています");

  if(Object.keys(players).length>=3)
    return showMessage("満員です");

  myId=playerId();
  myRoom=id;

  await set(ref(db,`rooms/${id}/players/${myId}`),{
    name,
    points:10000,
    ready:false,
    host:false
  });

  enterRoom();
};

function enterRoom(){
  document.getElementById("lobby").classList.add("hidden");
  document.getElementById("room").classList.remove("hidden");
  document.getElementById("roomId").textContent=myRoom;

  roomUnsubscribe=onValue(ref(db,"rooms/"+myRoom),snap=>{
    if(!snap.exists()){
      location.reload();
      return;
    }

    const room=snap.val();

    if(room.status==="waiting")renderRoom(room);
    if(room.status==="playing")showGame(room);
    if(room.status==="finished")showResult(room);
  });
}

function renderRoom(room){
  const players=room.players||{};
  const ids=Object.keys(players);
  const box=document.getElementById("players");

  box.innerHTML="";
  ids.forEach(id=>{
    const p=players[id];
    box.innerHTML+=`
      <div class="player">
        <div>
          ${p.name}${p.host?" 👑":""}
          <div class="points">${Number(p.points).toLocaleString()} pt</div>
        </div>
        <div class="${p.ready?"ready":"waiting"}">
          ${p.ready?"準備OK":"待機中"}
        </div>
      </div>`;
  });

  document.getElementById("betDisplay").textContent=
    Number(room.bet).toLocaleString();

  const me=players[myId];
  document.getElementById("readyBtn").textContent=
    me?.ready?"準備解除":"準備OK";

  const ready=ids.filter(id=>players[id].ready).length;

  document.getElementById("roomStatus").textContent=
    `${ids.length}/3人参加　｜　準備 ${ready}/${ids.length}`;

  if(
    ids.length===3 &&
    ready===3 &&
    room.host===myId &&
    !starting
  ){
    starting=true;
    startGame(room,ids);
  }
}

window.toggleReady=async()=>{
  const pRef=ref(db,`rooms/${myRoom}/players/${myId}`);
  const snap=await get(pRef);
  if(!snap.exists())return;

  await update(pRef,{
    ready:!snap.val().ready
  });
};

async function startGame(room,ids){
  const wall=shuffle(TILES);

  const hands={};

  ids.forEach(id=>{
    hands[id]=wall.splice(0,13);
  });

  await update(ref(db,"rooms/"+myRoom),{
    status:"playing",
    game:{
      order:ids,
      currentTurn:ids[0],
      wall,
      hands,
      discards:[],
      round:"東1局"
    }
  });
}

function showGame(room){
  document.getElementById("room").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  const game=room.game;
  if(!game)return;

  const ids=game.order||[];
  const players=room.players||{};
  const me=players[myId];

  document.getElementById("myName").textContent=me?.name||"あなた";
  document.getElementById("myPoints").textContent=
    (me?.points||0).toLocaleString()+" pt";

  const others=ids.filter(id=>id!==myId);

  if(others[0]){
    document.getElementById("topName").textContent=players[others[0]].name;
    document.getElementById("topPoints").textContent=
      Number(players[others[0]].points).toLocaleString()+" pt";
  }

  if(others[1]){
    document.getElementById("rightName").textContent=players[others[1]].name;
    document.getElementById("rightPoints").textContent=
      Number(players[others[1]].points).toLocaleString()+" pt";
  }

  document.getElementById("round").textContent=game.round||"東1局";
  document.getElementById("remaining").textContent=
    "山："+(game.wall?.length||0)+"枚";

  const turnPlayer=players[game.currentTurn];
  document.getElementById("turnDisplay").textContent=
    game.currentTurn===myId
      ? "🟢 あなたの番"
      : `⏳ ${turnPlayer?.name||"相手"}の番`;

  const drawBtn=document.getElementById("drawBtn");
  const hand=game.hands?.[myId]||[];

  drawBtn.disabled=!(
    game.currentTurn===myId &&
    hand.length===13 &&
    game.wall?.length>0
  );

  drawBtn.style.opacity=drawBtn.disabled?".35":"1";

  renderHand(game);
  renderDiscards(game);
}

function renderHand(game){
  const box=document.getElementById("myHand");
  const hand=game.hands?.[myId]||[];

  box.innerHTML="";

  hand.forEach((tile,index)=>{
    const el=document.createElement("div");
    el.className="tile";

    if(
      game.currentTurn===myId &&
      hand.length===14
    ){
      el.classList.add("playable");
      el.onclick=()=>discardTile(index);
    }

    el.textContent=tile;
    box.appendChild(el);
  });
}

function renderDiscards(game){
  const box=document.getElementById("discards");
  box.innerHTML="";

  (game.discards||[]).forEach(d=>{
    const el=document.createElement("div");
    el.className="discard";
    el.textContent=d.tile;
    box.appendChild(el);
  });
}

window.drawTile=async()=>{
  const gameRef=ref(db,`rooms/${myRoom}/game`);
  const snap=await get(gameRef);

  if(!snap.exists())return;

  const game=snap.val();

  if(game.currentTurn!==myId)return;
  if((game.hands[myId]||[]).length!==13)return;
  if(!game.wall?.length)return finishGame();

  const tile=game.wall.pop();

  game.hands[myId].push(tile);

  await update(gameRef,{
    wall:game.wall,
    [`hands/${myId}`]:game.hands[myId]
  });
};

async function discardTile(index){
  const gameRef=ref(db,`rooms/${myRoom}/game`);
  const snap=await get(gameRef);

  if(!snap.exists())return;

  const game=snap.val();

  if(game.currentTurn!==myId)return;
  if(game.hands[myId].length!==14)return;

  const tile=game.hands[myId].splice(index,1)[0];

  const order=game.order;
  const currentIndex=order.indexOf(myId);
  const next=order[(currentIndex+1)%order.length];

  game.discards.push({
    player:myId,
    tile
  });

  if(!game.wall.length){
    await update(ref(db,"rooms/"+myRoom),{
      status:"finished",
      game
    });
    return;
  }

  await update(gameRef,{
    [`hands/${myId}`]:game.hands[myId],
    discards:game.discards,
    currentTurn:next
  });
}

window.finishGame=async()=>{
  const roomSnap=await get(ref(db,"rooms/"+myRoom));
  if(!roomSnap.exists())return;

  const room=roomSnap.val();

  if(room.status!=="playing")return;

  const players=room.players||{};
  const ids=Object.keys(players);

  /*
    現段階では実際の役・点数計算は未実装。
    そのため終了時の順位は現在ポイント順。
    同点の場合はランダム順。
  */
  const ranking=[...ids].sort((a,b)=>{
    const diff=players[b].points-players[a].points;
    return diff!==0?diff:Math.random()-.5;
  });

  const bet=Number(room.bet)||0;
  const changes={
    [ranking[0]]:bet*2,
    [ranking[1]]:0,
    [ranking[2]]:-bet*2
  };

  const updates={status:"finished"};

  ranking.forEach(id=>{
    updates[`players/${id}/points`]=
      Math.max(0,Number(players[id].points)+changes[id]);
  });

  updates["result"]={
    ranking,
    changes
  };

  await update(ref(db,"rooms/"+myRoom),updates);
};

function showResult(room){
  document.getElementById("game").classList.remove("hidden");

  const result=room.result;
  if(!result)return;

  const players=room.players;
  const box=document.getElementById("resultBox");

  const medals=["🥇","🥈","🥉"];

  box.innerHTML=`
    <div class="result">
      <h2>対局終了 🀄</h2>
      ${result.ranking.map((id,index)=>{
        const change=result.changes[id];
        const cls=change>0?"positive":change<0?"negative":"";
        const sign=change>0?"+":"";
        return `
          <div class="rank">
            ${medals[index]} ${players[id].name}
            <br>
            <span class="${cls}">
              ${sign}${Number(change).toLocaleString()} pt
            </span>
            <br>
            <small>
              所持金：
              ${Number(players[id].points).toLocaleString()} pt
            </small>
          </div>`;
      }).join("")}
      <button class="main-btn" onclick="location.reload()">
        ロビーに戻る
      </button>
    </div>`;
}

window.copyRoomId=()=>{
  navigator.clipboard?.writeText(myRoom)
    .then(()=>alert("ルームIDをコピーしました"))
    .catch(()=>alert("ルームID："+myRoom));
};

window.leaveRoom=async()=>{
  if(myRoom&&myId){
    await remove(ref(db,`rooms/${myRoom}/players/${myId}`));
  }
  location.reload();
};

</script>
</body>
</html>
